[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huemcp"
version = "0.1.0"
description = "MCP server for controlling a Philips Hue bridge via the CLIP v2 API"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matt Bruton" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
huemcp = "huemcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/huemcp"]
